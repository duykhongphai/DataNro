<!doctype html>
<html lang="vi" data-theme="toi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DataNro — dữ liệu Ngọc Rồng Online</title>
<meta name="description" content="Tra cứu vật phẩm, quái, NPC, kĩ năng và bản đồ của Ngọc Rồng Online. Dữ liệu lấy thẳng từ máy chủ, cập nhật tự động mỗi ngày.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🐉</text></svg>">
<style>
/* ============ nền tảng ============ */
:root {
  --nen: #f6f7f9;
  --nen-noi: #ffffff;
  --nen-chim: #eceef2;
  --vien: #d8dce4;
  --chu: #171a20;
  --chu-mo: #646c7a;
  --nhan: #d95f2b;
  --nhan-chu: #ffffff;
  --xanh: #2f8f4e;
  --lam: #2b6fd9;
  --cam: #c8761a;
  --xam: #6b7280;
  --do: #c33c3c;
  --bong: 0 1px 2px rgba(16, 20, 30, .06), 0 8px 24px rgba(16, 20, 30, .06);
  --r: 10px;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Consolas, monospace;
}
html[data-theme="toi"] {
  --nen: #0e1116;
  --nen-noi: #161b22;
  --nen-chim: #1c222c;
  --vien: #2a323d;
  --chu: #e6e9ef;
  --chu-mo: #8b95a5;
  --nhan: #ff7a45;
  --nhan-chu: #1a0d06;
  --xanh: #56c07a;
  --lam: #62a0ff;
  --cam: #e5a24a;
  --xam: #98a2b3;
  --do: #f0716e;
  --bong: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .3);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--nen);
  color: var(--chu);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  -webkit-text-size-adjust: 100%;
}
a { color: var(--lam); }

/* ============ thanh trên ============ */
.dinh {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--nen) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--vien);
}
.dinh-trong {
  max-width: 1400px; margin: 0 auto; padding: 10px 16px;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
}
.hieu { display: flex; align-items: baseline; gap: 8px; margin-right: auto; }
.hieu b { font-size: 18px; letter-spacing: -.02em; }
.hieu span { color: var(--chu-mo); font-size: 12px; }

.tab { display: flex; gap: 2px; background: var(--nen-chim); padding: 3px; border-radius: var(--r); }
.tab button {
  border: 0; background: transparent; color: var(--chu-mo);
  padding: 6px 12px; border-radius: 7px; cursor: pointer;
  font: inherit; font-weight: 500; white-space: nowrap;
}
.tab button:hover { color: var(--chu); }
.tab button[aria-selected="true"] { background: var(--nhan); color: var(--nhan-chu); }

select, input[type="search"] {
  font: inherit; color: var(--chu); background: var(--nen-noi);
  border: 1px solid var(--vien); border-radius: 8px; padding: 6px 10px;
}
input[type="search"] { min-width: 240px; }
select:focus-visible, input:focus-visible, button:focus-visible {
  outline: 2px solid var(--nhan); outline-offset: 1px;
}
.nut-icon {
  border: 1px solid var(--vien); background: var(--nen-noi); color: var(--chu);
  width: 34px; height: 34px; border-radius: 8px; cursor: pointer; font-size: 15px;
  display: grid; place-items: center;
}

/* ============ thanh công cụ ============ */
.cong-cu {
  max-width: 1400px; margin: 0 auto; padding: 12px 16px 0;
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
}
.dem { color: var(--chu-mo); font-size: 13px; margin-left: auto; }
.dem b { color: var(--chu); font-variant-numeric: tabular-nums; }

/* ============ bảng ============ */
main { max-width: 1400px; margin: 0 auto; padding: 12px 16px 60px; }
.khung {
  background: var(--nen-noi); border: 1px solid var(--vien);
  border-radius: var(--r); box-shadow: var(--bong); overflow: hidden;
}
.cuon {
  overflow: auto;
  max-height: calc(100vh - 150px);
  overscroll-behavior: contain;
}
table { border-collapse: collapse; width: 100%; }
th, td { padding: 7px 10px; text-align: left; vertical-align: top; }
thead th {
  /* Dính theo khung .cuon (nó mới là chỗ cuộn), nên top phải là 0 chứ không phải chiều cao
     thanh trên - để 55px là header bị đẩy xuống đè lên mấy hàng đầu. */
  position: sticky; top: 0; z-index: 5;
  background: var(--nen-chim); color: var(--chu-mo);
  font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
  white-space: nowrap; border-bottom: 1px solid var(--vien);
}
tbody tr { border-top: 1px solid color-mix(in srgb, var(--vien) 55%, transparent); }
tbody tr:hover { background: color-mix(in srgb, var(--nhan) 7%, transparent); }
td.so { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--chu-mo); white-space: nowrap; }
td.ten { font-weight: 600; }
td.mo { color: var(--chu-mo); max-width: 460px; }
.anh {
  width: 32px; height: 32px; object-fit: contain; image-rendering: pixelated;
  background: var(--nen-chim); border-radius: 6px; padding: 2px;
}
.anh.trong { visibility: hidden; }
.bo-anh { display: flex; gap: 3px; }

.the {
  display: inline-block; padding: 1px 7px; border-radius: 20px;
  font-size: 11px; font-weight: 600; white-space: nowrap;
  border: 1px solid currentColor;
}
.the.dat { color: var(--xanh); }
.the.nam { color: var(--lam); }
.the.xay { color: var(--cam); }
.the.chung { color: var(--xam); }
.the.loai { color: var(--chu-mo); font-weight: 500; }

/* ============ kĩ năng ============ */
details.chieu { border-top: 1px solid color-mix(in srgb, var(--vien) 55%, transparent); }
details.chieu > summary {
  padding: 8px 10px; cursor: pointer; display: flex; gap: 10px; align-items: center;
  list-style: none;
}
details.chieu > summary::-webkit-details-marker { display: none; }
details.chieu > summary:hover { background: color-mix(in srgb, var(--nhan) 7%, transparent); }
details.chieu > summary::before { content: "▸"; color: var(--chu-mo); width: 12px; }
details.chieu[open] > summary::before { content: "▾"; }
.chieu-ten { font-weight: 600; }
.chieu-mo { color: var(--chu-mo); font-size: 13px; }
.cap { padding: 0 10px 12px 32px; }
.cap table { font-size: 13px; }
.cap thead th { position: static; background: transparent; border-bottom: 1px solid var(--vien); }
h2.lop {
  position: sticky; top: 0; z-index: 4;
  margin: 0; padding: 10px 12px; background: var(--nen-chim);
  font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--chu-mo);
  border-top: 1px solid var(--vien);
}
h2.lop:first-child { border-top: 0; }
h2.lop b { color: var(--chu); font-size: 14px; text-transform: none; letter-spacing: 0; }

.menu-npc { margin: 0; padding-left: 16px; color: var(--chu-mo); font-size: 13px; }

.trong-rong { padding: 40px 16px; text-align: center; color: var(--chu-mo); }
.loi { color: var(--do); }
footer {
  max-width: 1400px; margin: 0 auto; padding: 0 16px 40px;
  color: var(--chu-mo); font-size: 12px;
}
@media (max-width: 720px) {
  .cuon { max-height: calc(100vh - 190px); }
  td.mo { display: none; }
  th.mo { display: none; }
  input[type="search"] { min-width: 140px; flex: 1; }
}
</style>
</head>
<body>

<header class="dinh">
  <div class="dinh-trong">
    <div class="hieu"><b>DataNro</b> <span id="capnhat">đang tải…</span></div>
    <nav class="tab" id="tab" role="tablist"></nav>
    <button class="nut-icon" id="doi-mau" title="Đổi sáng/tối" aria-label="Đổi sáng tối">◐</button>
  </div>
</header>

<div class="cong-cu">
  <select id="chon-sv" aria-label="Chọn máy chủ"></select>
  <input type="search" id="tim" placeholder="Tìm theo tên, mô tả hoặc id…" autocomplete="off" spellcheck="false">
  <select id="sap" aria-label="Sắp xếp">
    <option value="id">Theo id</option>
    <option value="ten">Theo tên</option>
  </select>
  <span class="dem" id="dem"></span>
</div>

<main>
  <div class="khung"><div class="cuon" id="noi-dung"></div></div>
</main>

<footer>
  Dữ liệu lấy thẳng từ máy chủ game bằng <code>DataNro.Dumper</code>, cập nhật tự động mỗi ngày.
  <a id="link-json" href="#">Xem JSON gốc</a>
</footer>

<script>
"use strict";

// ==================== bảng tra cứu ====================

// Chép từ Models/ItemTemplateType.cs của engine. Máy chủ chỉ gửi một con số.
const LOAI_VAT_PHAM = {
  0: "Áo", 1: "Quần", 2: "Găng", 3: "Giày", 4: "Rađa / nhẫn",
  5: "Avatar, hoá trang", 6: "Đậu thần", 7: "Sách kĩ năng", 8: "Vật phẩm nhiệm vụ",
  9: "Vàng", 10: "Ngọc xanh", 11: "Đồ đeo lưng", 12: "Ngọc rồng", 13: "Bùa",
  14: "Đá nâng cấp", 15: "Mảnh vụn", 16: "Bình thần kì", 22: "Vệ tinh",
  23: "Đồ bay", 24: "Đồ bay VIP", 25: "Gói 10 rađa", 27: "Linh tinh / sự kiện",
  28: "Cờ pk", 29: "Đồ ăn tăng chỉ số", 30: "Đá pha lê", 31: "Bánh sự kiện",
  32: "Bộ đồ tập", 33: "Thẻ sưu tầm", 34: "Ngọc khoá", 35: "Sách bí kíp",
  36: "Danh hiệu", 37: "Sách kĩ năng loại hai"
};

// Client hiển thị theo hành tinh; 3 nghĩa là dùng chung cho cả ba.
const HANH_TINH = [
  { ten: "Trái Đất", lop: "dat" },
  { ten: "Namếc", lop: "nam" },
  { ten: "Xayda", lop: "xay" },
  { ten: "Chung", lop: "chung" }
];

const MUC = {
  vatpham: { ten: "Vật phẩm", tep: "ItemTemplates.json", ve: veVatPham },
  quai:    { ten: "Quái",     tep: "MobTemplates.json",  ve: veQuai },
  npc:     { ten: "NPC",      tep: "NpcTemplates.json",  ve: veNpc },
  chieu:   { ten: "Kĩ năng",  tep: "NClasses.json",      ve: veChieu },
  option:  { ten: "Option",   tep: "ItemOptionTemplates.json", ve: veOption },
  map:     { ten: "Map",      tep: "Maps.json",          ve: veMap }
};

const MAC_DINH = {
  nhaPhatHanh: [{ id: "TeaMobi", ten: "TeaMobi", mayChu: [{ id: "Server1", ten: "Server 1" }] }]
};

// ==================== trạng thái ====================

const trangThai = {
  chiMuc: MAC_DINH,
  nph: "TeaMobi",
  sv: "Server1",
  muc: "vatpham",
  tim: "",
  sap: "id"
};

const kho = new Map();   // "nph/sv/tep" -> mảng đã tải
const $ = (id) => document.getElementById(id);

// ==================== tiện ích ====================

/** 1234 → "1,2N", 2000000000 → "2T". Cột sức mạnh / máu toàn số dài, để nguyên thì không đọc nổi. */
function gonSo(n) {
  if (n === null || n === undefined) return "";
  const x = Number(n);
  if (!isFinite(x)) return String(n);
  const dau = x < 0 ? "-" : "";
  const a = Math.abs(x);
  const rut = (v, d) => dau + (v % 1 === 0 ? v : v.toFixed(1)).toString().replace(".", ",") + d;
  if (a >= 1e9) return rut(Math.round(a / 1e8) / 10, "T");
  if (a >= 1e6) return rut(Math.round(a / 1e5) / 10, "Tr");
  if (a >= 1e3) return rut(Math.round(a / 1e2) / 10, "N");
  return dau + a.toLocaleString("vi-VN");
}

function thoat(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/** Ảnh icon; thiếu ảnh thì ẩn đi chứ đừng để khung vỡ. */
function veAnh(id) {
  if (id === null || id === undefined || id < 0) return '<span class="anh trong"></span>';
  return `<img class="anh" loading="lazy" decoding="async" alt=""
    src="${trangThai.nph}/Icons/${id}.png"
    onerror="this.classList.add('trong')">`;
}

function theHanhTinh(g) {
  const h = HANH_TINH[g] || { ten: "?" + g, lop: "chung" };
  return `<span class="the ${h.lop}">${h.ten}</span>`;
}

function khongDau(s) {
  return String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/gi, "d").toLowerCase();
}

// ==================== tải dữ liệu ====================

async function docJson(duong) {
  const res = await fetch(duong, { cache: "no-cache" });
  if (!res.ok) throw new Error(res.status + " " + res.statusText);
  return res.json();
}

async function layMuc(muc) {
  const tep = MUC[muc].tep;
  const khoa = `${trangThai.nph}/${trangThai.sv}/${tep}`;
  if (kho.has(khoa)) return kho.get(khoa);
  const dl = await docJson(khoa);
  kho.set(khoa, dl);
  return dl;
}

// ==================== vẽ từng mục ====================

function bang(cot, hang) {
  return `<table><thead><tr>${cot}</tr></thead><tbody>${hang}</tbody></table>`;
}

function veVatPham(ds) {
  const cot = `<th>Ảnh</th><th>Id</th><th>Tên</th><th class="mo">Mô tả</th>
    <th>Loại</th><th>Cho</th><th>Sức mạnh</th><th>Cấp</th>`;
  const hang = ds.map((x) => `<tr>
    <td>${veAnh(x.iconID)}</td>
    <td class="so">${x.id}</td>
    <td class="ten">${thoat(x.name)}</td>
    <td class="mo">${thoat(x.description)}</td>
    <td><span class="the loai">${thoat(LOAI_VAT_PHAM[x.type] ?? "loại " + x.type)}</span></td>
    <td>${theHanhTinh(x.gender)}</td>
    <td class="so">${x.strRequire > 0 ? gonSo(x.strRequire) : ""}</td>
    <td class="so">${x.level || ""}</td>
  </tr>`).join("");
  return bang(cot, hang);
}

function veQuai(ds) {
  const cot = `<th>Id</th><th>Tên</th><th>Máu</th><th>Loại</th><th>Tầm đi</th><th>Tốc độ</th><th>Phi tiêu</th>`;
  const hang = ds.map((x) => `<tr>
    <td class="so">${x.mobTemplateId}</td>
    <td class="ten">${thoat(x.name)}</td>
    <td class="so">${gonSo(x.hp)}</td>
    <td class="so">${x.type}</td>
    <td class="so">${x.rangeMove}</td>
    <td class="so">${x.speed}</td>
    <td class="so">${x.dartType}</td>
  </tr>`).join("");
  return bang(cot, hang);
}

function veNpc(ds) {
  const cot = `<th>Hình</th><th>Id</th><th>Tên</th><th class="mo">Menu</th>`;
  const hang = ds.map((x) => `<tr>
    <td><div class="bo-anh">${veAnh(x.headId)}${veAnh(x.bodyId)}${veAnh(x.legId)}</div></td>
    <td class="so">${x.npcTemplateId}</td>
    <td class="ten">${thoat(x.name)}</td>
    <td class="mo"><ul class="menu-npc">${(x.menu || [])
      .map((m) => `<li>${(m || []).map(thoat).join(" · ")}</li>`).join("")}</ul></td>
  </tr>`).join("");
  return bang(cot, hang);
}

function veOption(ds) {
  const cot = `<th>Id</th><th>Tên</th><th>Loại</th>`;
  const hang = ds.map((x) => `<tr>
    <td class="so">${x.id}</td>
    <td class="ten">${thoat(x.name)}</td>
    <td class="so">${x.type}</td>
  </tr>`).join("");
  return bang(cot, hang);
}

function veMap(ds) {
  const cot = `<th>Id</th><th>Tên</th>`;
  const hang = ds.map((x) => `<tr>
    <td class="so">${x.id}</td>
    <td class="ten">${thoat(x.name)}</td>
  </tr>`).join("");
  return bang(cot, hang);
}

/**
 * Lọc cây kĩ năng theo ô tìm: giữ chiêu nào khớp, lớp nào không còn chiêu thì bỏ luôn.
 * Trả về cây mới chứ không sửa cây gốc - còn phải dùng lại khi xoá ô tìm.
 */
function locChieu(ds) {
  const q = khongDau(trangThai.tim.trim());
  if (!q) return ds;

  return ds
    .map((lop) => ({
      ...lop,
      skillTemplates: (lop.skillTemplates || []).filter((st) =>
        khongDau(st.name).includes(q) ||
        khongDau(st.description).includes(q) ||
        khongDau(st.damInfo).includes(q) ||
        String(st.id) === q)
    }))
    .filter((lop) => lop.skillTemplates.length > 0);
}

/**
 * Kĩ năng lồng ba tầng (lớp → chiêu → cấp) nên không nhét vừa một bảng phẳng:
 * mỗi chiêu là một khối mở ra được, bên trong mới là bảng các cấp.
 */
function veChieu(ds) {
  return ds.map((lop) => {
    const chieu = (lop.skillTemplates || []).map((st) => {
      const cap = (st.skills || []).map((sk) => `<tr>
        <td class="so">${sk.point}</td>
        <td class="so">${gonSo(sk.powRequire)}</td>
        <td class="so">${sk.damage}</td>
        <td class="so">${gonSo(sk.manaUse)}</td>
        <td class="so">${(sk.coolDown / 1000).toString().replace(".", ",")}s</td>
        <td class="so">${sk.dx} × ${sk.dy}</td>
        <td class="so">${sk.price || ""}</td>
        <td>${thoat(sk.moreInfo)}</td>
      </tr>`).join("");

      return `<details class="chieu">
        <summary>
          ${veAnh(st.iconId)}
          <span>
            <span class="chieu-ten">${thoat(st.name)}</span>
            <span class="chieu-mo"> — ${thoat(st.description)} · ${thoat(st.damInfo)}</span>
          </span>
        </summary>
        <div class="cap">${bang(
          `<th>Cấp</th><th>Sức mạnh</th><th>Sát thương</th><th>Ki</th><th>Hồi</th><th>Tầm</th><th>Giá</th><th>Học ở</th>`,
          cap)}</div>
      </details>`;
    }).join("");

    const phu = lop.serverName && lop.serverName !== lop.name
      ? ` — máy chủ gọi là “${thoat(lop.serverName)}”` : "";
    return `<h2 class="lop"><b>${thoat(lop.name)}</b>${phu}</h2>${chieu}`;
  }).join("");
}

// ==================== lọc và sắp ====================

function tenCua(x) {
  return x.name ?? "";
}

function idCua(x) {
  return x.id ?? x.mobTemplateId ?? x.npcTemplateId ?? x.classId ?? 0;
}

function loc(ds) {
  const q = khongDau(trangThai.tim.trim());
  let ra = ds;

  if (q) {
    ra = ds.filter((x) =>
      khongDau(tenCua(x)).includes(q) ||
      khongDau(x.description).includes(q) ||
      String(idCua(x)) === q);
  }

  if (trangThai.sap === "ten") {
    ra = ra.slice().sort((a, b) => tenCua(a).localeCompare(tenCua(b), "vi"));
  } else if (ra !== ds) {
    ra = ra.slice().sort((a, b) => idCua(a) - idCua(b));
  }

  return ra;
}

// ==================== vẽ lại ====================

let phienVe = 0;

async function ve() {
  const phien = ++phienVe;
  const noi = $("noi-dung");
  const muc = MUC[trangThai.muc];

  $("link-json").href = `${trangThai.nph}/${trangThai.sv}/${muc.tep}`;

  let ds;
  try {
    ds = await layMuc(trangThai.muc);
  } catch (e) {
    if (phien !== phienVe) return;
    noi.innerHTML = `<p class="trong-rong loi">Không đọc được ${thoat(muc.tep)}: ${thoat(e.message)}</p>`;
    $("dem").textContent = "";
    return;
  }
  if (phien !== phienVe) return;

  // Kĩ năng lồng nhau nên lọc theo cây riêng, không dùng được hàm loc() phẳng.
  if (trangThai.muc === "chieu") {
    const cay = locChieu(ds);
    const demChieu = (x) => x.reduce((t, l) => t + l.skillTemplates.length, 0);
    noi.innerHTML = cay.length
      ? veChieu(cay)
      : `<p class="trong-rong">Không có kĩ năng nào khớp “${thoat(trangThai.tim)}”.</p>`;
    $("dem").innerHTML = trangThai.tim.trim()
      ? `<b>${demChieu(cay)}</b>/${demChieu(ds)} kĩ năng`
      : `<b>${demChieu(ds)}</b> kĩ năng, ${ds.length} lớp`;
    return;
  }

  const loc1 = loc(ds);
  noi.innerHTML = loc1.length
    ? muc.ve(loc1)
    : `<p class="trong-rong">Không có mục nào khớp “${thoat(trangThai.tim)}”.</p>`;
  $("dem").innerHTML = loc1.length === ds.length
    ? `<b>${ds.length}</b> mục`
    : `<b>${loc1.length}</b>/${ds.length} mục`;
}

async function veMocCapNhat() {
  try {
    const res = await fetch(`${trangThai.nph}/${trangThai.sv}/LastUpdated`, { cache: "no-cache" });
    if (!res.ok) throw new Error();
    const t = new Date((await res.text()).trim());
    $("capnhat").textContent = "cập nhật " + t.toLocaleString("vi-VN");
  } catch {
    $("capnhat").textContent = "";
  }
}

// ==================== khung điều khiển ====================

function veTab() {
  $("tab").innerHTML = Object.entries(MUC).map(([k, v]) =>
    `<button role="tab" data-muc="${k}" aria-selected="${k === trangThai.muc}">${v.ten}</button>`).join("");
}

function veChonSv() {
  const sel = $("chon-sv");
  sel.innerHTML = trangThai.chiMuc.nhaPhatHanh.map((n) =>
    `<optgroup label="${thoat(n.ten)}">${n.mayChu.map((m) =>
      `<option value="${thoat(n.id)}|${thoat(m.id)}">${thoat(m.ten)}</option>`).join("")}</optgroup>`).join("");
  sel.value = `${trangThai.nph}|${trangThai.sv}`;
}

function docHash() {
  const m = location.hash.match(/^#\/([^/]+)\/([^/]+)\/([^/?]+)/);
  if (!m) return;
  trangThai.nph = decodeURIComponent(m[1]);
  trangThai.sv = decodeURIComponent(m[2]);
  if (MUC[m[3]]) trangThai.muc = m[3];
}

function ghiHash() {
  const h = `#/${trangThai.nph}/${trangThai.sv}/${trangThai.muc}`;
  if (location.hash !== h) history.replaceState(null, "", h);
}

function datMau(m) {
  document.documentElement.dataset.theme = m;
  try { localStorage.setItem("datanro-mau", m); } catch {}
}

async function khoiDong() {
  try { datMau(localStorage.getItem("datanro-mau") || "toi"); } catch {}

  try {
    trangThai.chiMuc = await docJson("index.json");
  } catch {
    // Chạy tay một máy chủ thì chưa có index.json, cứ dùng mặc định.
    trangThai.chiMuc = MAC_DINH;
  }

  const dau = trangThai.chiMuc.nhaPhatHanh?.[0];
  if (dau) {
    trangThai.nph = dau.id;
    trangThai.sv = dau.mayChu?.[0]?.id ?? trangThai.sv;
  }
  docHash();

  veTab();
  veChonSv();
  ghiHash();
  veMocCapNhat();
  ve();

  $("tab").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-muc]");
    if (!b) return;
    trangThai.muc = b.dataset.muc;
    veTab();
    ghiHash();
    ve();
  });

  $("chon-sv").addEventListener("change", (e) => {
    const [nph, sv] = e.target.value.split("|");
    trangThai.nph = nph;
    trangThai.sv = sv;
    ghiHash();
    veMocCapNhat();
    ve();
  });

  let hen;
  $("tim").addEventListener("input", (e) => {
    trangThai.tim = e.target.value;
    clearTimeout(hen);
    hen = setTimeout(ve, 150);
  });

  $("sap").addEventListener("change", (e) => {
    trangThai.sap = e.target.value;
    ve();
  });

  $("doi-mau").addEventListener("click", () => {
    datMau(document.documentElement.dataset.theme === "toi" ? "sang" : "toi");
  });

  // Bấm lùi/tiến hoặc dán một địa chỉ có sẵn #/... thì phải theo, không thì nút lùi của
  // trình duyệt đổi địa chỉ mà trang đứng im.
  window.addEventListener("hashchange", () => {
    const truoc = `${trangThai.nph}|${trangThai.sv}|${trangThai.muc}`;
    docHash();
    if (`${trangThai.nph}|${trangThai.sv}|${trangThai.muc}` === truoc) return;
    veTab();
    veChonSv();
    veMocCapNhat();
    ve();
  });

  // Gõ "/" là nhảy vào ô tìm, quen tay như mọi trang tra cứu khác.
  document.addEventListener("keydown", (e) => {
    if (e.key === "/" && document.activeElement !== $("tim")) {
      e.preventDefault();
      $("tim").focus();
    }
  });
}

khoiDong();
</script>
</body>
</html>
